title: "&8ᴋɪᴛ ѕᴇʟᴇᴄᴛᴏʀ"
rows: 3
filler:
  enabled: true
  material: "GRAY_STAINED_GLASS_PANE"
  name: " "
  lore: []
buttons:
  previous-page:
    slot: 9
    material: "ARROW"
    name: ":arrow: &e&lPREVIOUS PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage {page} of {pages}."
      - " "
      - "&a→ Click to go to page {previous_page} ←"
    enabled: true
    action: "kits.page.previous"
    states:
      unavailable:
        material: "GRAY_STAINED_GLASS_PANE"
        name: " "
        lore: []
        clickable: false
  next-page:
    slot: 17
    material: "ARROW"
    name: ":arrow: &e&lNEXT PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage {page} of {pages}."
      - " "
      - "&a→ Click to go to page {next_page} ←"
    enabled: true
    action: "kits.page.next"
    states:
      unavailable:
        material: "GRAY_STAINED_GLASS_PANE"
        name: " "
        lore: []
        clickable: false
entries:
  kits:
    slots:
      - 11
      - 12
      - 13
      - 14
      - 15
    source-item:
      default-name: "{material_sprite}{theme}{kit}"
      lore-states:
        available:
          mode: "append"
          lines:
            - "{white}Left click to claim this kit."
            - "{white}Right click to preview its contents."
            - ""
            - ":lime_dye: {muted}Status: {good}Ready"
        cooldown:
          mode: "append"
          lines:
            - "{white}Left click to try claiming."
            - "{white}Right click to preview its contents."
            - ""
            - ":clock: {muted}Next claim in: {theme}{time_remaining}"
        no-permission:
          mode: "append"
          lines:
            - "{white}Left click to try claiming."
            - "{white}Right click to preview its contents."
            - ""
            - ":red_dye: {muted}Status: {bad}Missing permission"
        world-blocked:
          mode: "append"
          lines:
            - "{white}Left click to try claiming."
            - "{white}Right click to preview its contents."
            - ""
            - ":barrier: {muted}Status: {bad}Unavailable in {world}"
        claimed-once:
          mode: "append"
          lines:
            - "{white}Left click to try claiming."
            - "{white}Right click to preview its contents."
            - ""
            - ":red_dye: {muted}Status: {bad}Already claimed"
        disabled:
          mode: "append"
          lines:
            - ":barrier: {white}This kit is currently disabled."
    empty-item:
      material: "LIGHT_GRAY_STAINED_GLASS_PANE"
      name: " "
      lore: []
    actions:
      left: "kits.claim"
      shift-left: "kits.claim"
      right: "kits.preview"
      shift-right: "kits.preview"
