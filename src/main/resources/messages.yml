admin-resetcooldown-usage: "{prefix}{muted}Use {theme}/fokitsadmin resetcooldown <player> [kit]"
admin-reset-cooldown-success: "{prefix}{good}Reset {theme}{count}{good} kit cooldown(s) for {theme}{player}{good}."
admin-reset-kit-cooldown-success: "{prefix}{good}Reset cooldown for {theme}{kit}{good} for {theme}{player}{good}."
player-not-found: "{prefix}{bad}Player {theme}{player}{bad} was not found."
editor-opened: "{prefix}{good}Opened the FoKits editor."
admin-version: "{prefix}{muted}Author: {theme}{author}{muted} | Version: {theme}{version}"
reload-success: "{prefix}{good}Reload complete. {muted}Loaded kits: {theme}{kit_count}{muted} | Config version: {theme}{config_version}"
reload-failed: "{prefix}{bad}Reload failed at {theme}{step}{bad}. {muted}{error}"
