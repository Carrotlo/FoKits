prompt-cancelled: "{prefix}{bad}Input cancelled."
native-dialogs-fallback: "{prefix}{muted}Native dialogs are unavailable on this server. Using chat input fallback."
invalid-input: "{prefix}{bad}Invalid input."
saved: "{prefix}{good}Saved changes."
layout-editor-start: "{prefix}{muted}Layout editor: place {theme}CHEST{muted} items as kit slots, any other items become static GUI items, then close to save."
copied-inventory: "{prefix}{good}Copied your inventory into the kit item editor."
deleted: "{prefix}{good}Deleted kit {theme}{kit}{good}."
created: "{prefix}{good}Created kit {theme}{kit}{good}."
renamed: "{prefix}{good}Renamed kit to {theme}{kit}{good}."
placeholder-unavailable: "{prefix}{muted}PlaceholderAPI was not found."
